[package]
repository = "https://github.com/SuperInstance/cross-compile-checker"
name = "cross-compile-checker"
version = "0.1.0"
edition = "2021"
description = "CLI tool to check cross-compilation compatibility of Rust projects"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
comfy-table = "7"
rayon = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
